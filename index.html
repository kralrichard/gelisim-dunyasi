<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080b14">
<meta name="description" content="1000 konu, 110 alan. Her konu bir mini oyun: uçak mühendisliğinde uçak uçur, astronomide uzay gemisi sür.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<title>Gelişim Dünyası</title>
<style>
:root{
  --bg:#080b14; --ink:#f2f4ff; --dim:#98a1c4; --dim2:#666e94;
  --surf:rgba(255,255,255,.06); --surf2:rgba(255,255,255,.11);
  --ease:cubic-bezier(.22,1,.36,1);
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --a1:#6ea8ff; --a2:#3f6bff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
canvas{display:block;touch-action:none}

/* ---------- katmanlar ---------- */
.scr{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .28s var(--ease),transform .32s var(--ease);transform:scale(1.02)}
.scr.on{opacity:1;pointer-events:auto;transform:none}
.list{overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--st) + 14px) 0 calc(30px + var(--sb));
  background:radial-gradient(120% 80% at 50% -10%,#151b33 0%,#0a0e1a 60%,#05070d 100%)}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:.86rem}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top .grow{flex:1;min-width:0}
.bk{width:40px;height:40px;border-radius:50%;background:var(--surf);display:grid;place-items:center;font-size:1.1rem;flex:0 0 auto;transition:transform .18s var(--ease)}
.bk:active{transform:scale(.9)}

/* ---------- harita HUD ---------- */
#hudTop{position:fixed;top:calc(var(--st) + 12px);left:0;right:0;display:flex;gap:8px;padding:0 14px;z-index:6;pointer-events:none}
.pill{background:rgba(15,19,34,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:999px;padding:9px 15px;font-size:.85rem;font-weight:700;white-space:nowrap;pointer-events:auto;
  transition:transform .18s var(--ease)}
.pill:active{transform:scale(.94)}
#hudTop .grow{flex:1}
#tip{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 62px);z-index:6;
  background:rgba(15,19,34,.75);backdrop-filter:blur(14px);padding:7px 16px;border-radius:999px;
  font-size:.8rem;color:var(--dim);pointer-events:none;opacity:0;transition:opacity .3s}
#tip.on{opacity:1}
#enter{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(96px + var(--sb));z-index:7;
  padding:15px 30px;border-radius:999px;font-weight:800;font-size:1.02rem;color:#06101f;
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 12px 34px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:.3s var(--ease);display:flex;align-items:center;gap:9px;max-width:88vw}
#enter.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#enter:active{transform:translateX(-50%) scale(.95)}
#stick{position:fixed;left:22px;bottom:calc(26px + var(--sb));width:118px;height:118px;border-radius:50%;
  background:rgba(255,255,255,.05);z-index:5;display:none}
#stick.on{display:block}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:rgba(255,255,255,.22);backdrop-filter:blur(6px)}

/* ---------- alt gezinme ---------- */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sb));z-index:8;display:flex;gap:4px;
  background:rgba(16,20,36,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:999px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#nav button{display:flex;align-items:center;gap:6px;border-radius:999px;padding:10px 13px;font-size:.8rem;
  font-weight:700;color:var(--dim);transition:color .25s,background .3s var(--ease)}
#nav button.on{color:var(--ink);background:var(--surf2)}
#nav.hide{opacity:0;pointer-events:none}

/* ---------- kartlar ---------- */
.row{display:flex;align-items:center;gap:13px;background:var(--surf);border-radius:19px;padding:13px 15px;margin-bottom:9px;
  width:100%;text-align:left;transition:transform .2s var(--ease),background .2s}
.row:active{transform:scale(.98);background:var(--surf2)}
.row .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:1.45rem;flex:0 0 auto}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:750;font-size:.99rem;letter-spacing:-.01em}
.row .tx span{color:var(--dim);font-size:.79rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ck{font-size:1rem;color:var(--dim2);flex:0 0 auto}
.row.done .ck{color:#5ce6a0}

.search{display:flex;align-items:center;gap:10px;background:var(--surf);border-radius:17px;padding:12px 15px;margin-bottom:18px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:1rem}
.search input::placeholder{color:var(--dim2)}
.grouphead{font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);
  margin:20px 0 9px}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .6s var(--ease)}
.blk{background:var(--surf);border-radius:22px;padding:17px 18px;margin-bottom:11px}
.blk h2{font-size:1rem;margin-bottom:11px}
.line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:.93rem}
.line+.line{border-top:1px solid rgba(255,255,255,.06)}
.chip{background:var(--surf);border-radius:999px;padding:9px 17px;font-weight:700;font-size:.87rem}
.empty{text-align:center;color:var(--dim2);padding:44px 20px;font-size:.93rem}

/* ---------- oyun ekranı ---------- */
#oyun{background:#05070d;display:flex;flex-direction:column}
#gtop{position:absolute;top:calc(var(--st) + 12px);left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:0 14px;z-index:4}
#gtop .t{flex:1;min-width:0;font-weight:750;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 2px 8px rgba(0,0,0,.7)}
#ghint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--sb));z-index:4;
  background:rgba(0,0,0,.42);backdrop-filter:blur(10px);padding:9px 18px;border-radius:999px;font-size:.82rem;
  color:rgba(255,255,255,.85);pointer-events:none;text-align:center;max-width:92vw}
#gcanvas{position:absolute;inset:0;width:100%;height:100%}

/* ---------- sonuç kartı ---------- */
#sonuc{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;
  background:rgba(4,6,12,.72);backdrop-filter:blur(10px);padding:16px}
#sonuc.on{display:flex}
#sheet{width:100%;max-width:540px;background:linear-gradient(165deg,#1a2038,#0e1322);border-radius:30px;
  padding:26px 22px calc(24px + var(--sb));text-align:center;animation:up .42s var(--ease)}
@keyframes up{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
#sheet .mark{width:78px;height:78px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:2.1rem;
  background:linear-gradient(135deg,var(--a1),var(--a2));color:#06101f;animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(.4);opacity:0}62%{transform:scale(1.1)}100%{transform:scale(1)}}
#sheet h3{font-size:1.22rem;font-weight:800;margin-bottom:6px}
#sheet .fact{font-size:1.06rem;line-height:1.6;color:#dce3ff;background:rgba(255,255,255,.05);
  border-radius:18px;padding:15px 16px;margin:14px 0 6px;text-align:left}
#sheet .kelime{display:flex;justify-content:space-between;font-size:.94rem;padding:7px 0;color:#dce3ff}
#sheet .kelime+.kelime{border-top:1px solid rgba(255,255,255,.07)}
#sheet .kelime b{color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;
  background:linear-gradient(135deg,var(--a1),var(--a2));color:#06101f;font-weight:800;font-size:1rem;
  border-radius:18px;padding:15px;transition:transform .18s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--surf);color:var(--ink)}

/* ---------- VOXEL DÜNYA ---------- */
#s-dunya{background:#7fb2e5;overflow:hidden}
#wcanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;z-index:3;pointer-events:none;
  opacity:.85;mix-blend-mode:difference}
#crosshair:before,#crosshair:after{content:'';position:absolute;background:#fff}
#crosshair:before{left:10px;top:0;width:2px;height:22px}
#crosshair:after{top:10px;left:0;height:2px;width:22px}
#wtop{position:absolute;top:calc(var(--st) + 10px);left:0;right:0;z-index:4;display:flex;gap:7px;padding:0 12px;align-items:flex-start}
#wtop .pill{font-size:.76rem;padding:7px 12px}
#wstat{font-variant-numeric:tabular-nums}
#hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(72px + var(--sb));z-index:4;
  display:flex;gap:5px;background:rgba(8,12,22,.6);backdrop-filter:blur(10px);padding:5px;border-radius:16px}
.slot{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.08);position:relative;
  display:grid;place-items:center;transition:transform .16s var(--ease),box-shadow .16s}
.slot.on{box-shadow:0 0 0 2.5px #fff;transform:translateY(-5px)}
.slot i{width:26px;height:26px;border-radius:5px;display:block;box-shadow:inset 0 -7px 0 rgba(0,0,0,.22)}
.slot b{position:absolute;right:3px;bottom:1px;font-size:.6rem;font-weight:800;text-shadow:0 1px 2px #000}
#wpad{position:absolute;inset:0;z-index:3;pointer-events:none}
#wpad button{position:absolute;pointer-events:auto;background:rgba(255,255,255,.13);backdrop-filter:blur(8px);
  border-radius:50%;display:grid;place-items:center;font-size:1.35rem;transition:transform .12s}
#wpad button:active{transform:scale(.9);background:rgba(255,255,255,.28)}
#bZipla{right:20px;bottom:calc(136px + var(--sb));width:66px;height:66px}
#bUc{right:96px;bottom:calc(150px + var(--sb));width:50px;height:50px;font-size:1.1rem}
#bKir{right:20px;bottom:calc(212px + var(--sb));width:56px;height:56px}
#bKoy{right:88px;bottom:calc(216px + var(--sb));width:50px;height:50px;font-size:1.05rem}
#wstick{position:absolute;left:24px;bottom:calc(120px + var(--sb));width:112px;height:112px;border-radius:50%;
  background:rgba(255,255,255,.07);z-index:3;pointer-events:none}
#wstick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;
  background:rgba(255,255,255,.26)}
#kulePrompt{position:absolute;left:50%;transform:translateX(-50%) translateY(16px);bottom:calc(136px + var(--sb));z-index:5;
  padding:14px 26px;border-radius:999px;font-weight:800;font-size:1rem;color:#06101f;
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 14px 36px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:.3s var(--ease);display:flex;align-items:center;gap:9px;max-width:88vw}
#kulePrompt.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#wmsg{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--st) + 56px);z-index:5;
  background:rgba(8,12,22,.75);backdrop-filter:blur(10px);padding:9px 18px;border-radius:999px;font-size:.82rem;
  opacity:0;transition:.35s;pointer-events:none;text-align:center;max-width:90vw}
#wmsg.on{opacity:1}
@media (pointer:fine){#wstick,#wpad{display:none}}
#nav em{font-style:normal}
@media (max-width:440px){#nav em{display:none}#nav button{padding:11px 13px}#nav button span{font-size:1.2rem}}

/* ---------- 3B MOD ---------- */
#s-3d{background:radial-gradient(120% 90% at 50% 0%,#161d3a 0%,#0a0e1c 55%,#04060c 100%);overflow:hidden}
#stage3d{position:absolute;inset:0;perspective:1100px;perspective-origin:50% 46%;touch-action:none;cursor:grab}
#stage3d:active{cursor:grabbing}
#globe{position:absolute;left:50%;top:46%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.t3{position:absolute;transform-style:preserve-3d;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:22px;text-align:center;user-select:none;cursor:pointer;
  box-shadow:0 8px 26px rgba(0,0,0,.45);transition:filter .2s}
.t3 .e{font-size:1.5rem;line-height:1}
.t3 .n{font-size:.5rem;font-weight:800;line-height:1.15;padding:0 4px;color:#08101e;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.t3 .code{font-size:.86rem;font-weight:900;color:#08101e}
.t3.dim{filter:grayscale(.85) brightness(.5)}
.t3 .ok{position:absolute;top:5px;right:7px;font-size:.6rem;color:#0a3d24;font-weight:900}
.k3{position:absolute;transform-style:preserve-3d;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:20px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;
  cursor:pointer;box-shadow:0 12px 34px rgba(0,0,0,.5);user-select:none}
.k3 .num{font-size:.66rem;font-weight:900;opacity:.65;color:#08101e}
.k3 .ttl{font-size:.84rem;font-weight:800;line-height:1.25;color:#08101e}
.k3 .st{font-size:.62rem;font-weight:800;color:#08101e;opacity:.7}
.k3.front{box-shadow:0 0 0 3px rgba(255,255,255,.9),0 18px 44px rgba(0,0,0,.6)}
#d3top{position:absolute;top:calc(var(--st) + 12px);left:0;right:0;z-index:5;display:flex;gap:8px;
  padding:0 14px;align-items:center}
#d3chips{position:absolute;top:calc(var(--st) + 60px);left:0;right:0;z-index:5;display:flex;gap:7px;
  overflow-x:auto;padding:0 14px 4px;scrollbar-width:none}
#d3chips::-webkit-scrollbar{display:none}
#d3chips button{background:rgba(255,255,255,.07);border-radius:999px;padding:7px 14px;font-size:.76rem;
  font-weight:700;color:var(--dim);white-space:nowrap;transition:.2s}
#d3chips button.on{background:#fff;color:#0a0e1c}
#d3info{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--sb));z-index:5;
  text-align:center;pointer-events:none;max-width:92%;
  background:rgba(8,12,24,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:8px 18px;border-radius:20px}
#d3info b{display:block;font-size:1.05rem;font-weight:800}
#d3info span{font-size:.78rem;color:var(--dim)}

#toast{position:fixed;left:50%;bottom:calc(88px + var(--sb));transform:translate(-50%,14px);z-index:30;
  background:var(--ink);color:#080b14;font-weight:750;font-size:.87rem;padding:11px 19px;border-radius:999px;
  opacity:0;transition:.3s var(--ease);pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>

<!-- VOXEL DÜNYA -->
<section class="scr on" id="s-dunya">
  <canvas id="wcanvas"></canvas>
  <div id="crosshair"></div>
  <div id="wtop">
    <div class="pill" id="wstat">…</div>
    <div style="flex:1"></div>
    <button class="pill" id="wPusula">🧭 Kule</button>
  </div>
  <div id="wmsg"></div>
  <div id="wstick"><i></i></div>
  <div id="wpad">
    <button id="bZipla">⤒</button><button id="bUc">✈</button>
    <button id="bKir">⛏</button><button id="bKoy">🧱</button>
  </div>
  <div id="hotbar"></div>
  <button id="kulePrompt"><span id="kuleIc">🏛️</span><span id="kuleTx">Gir</span></button>
</section>

<!-- HARİTA -->
<section class="scr" id="s-harita">
  <canvas id="map"></canvas>
  <div id="hudTop">
    <div class="pill" id="lvlPill">⭐ Sv 1</div>
    <div class="grow"></div>
    <button class="pill" id="findBtn">🔎 Bul</button>
  </div>
  <div id="tip">Sürükleyerek uç · bir alana yaklaş</div>
  <button id="enter"><span id="enterIc">🚀</span><span id="enterTx">Gir</span></button>
  <div id="stick"><i></i></div>
</section>

<!-- ALAN -->
<section class="scr list" id="s-alan">
  <div class="wrap">
    <div class="top">
      <button class="bk" id="alanBack">←</button>
      <div class="grow"><h1 id="alanAd">Alan</h1><div class="sub" id="alanSub"></div></div>
    </div>
    <div class="bar" style="margin-bottom:16px"><i id="alanBar"></i></div>
    <div id="konuList"></div>
  </div>
</section>

<!-- LİSTE -->
<section class="scr list" id="s-liste">
  <div class="wrap">
    <div class="top"><div class="grow"><h1>Alanlar</h1><div class="sub" id="listeSub"></div></div></div>
    <div class="search"><span>🔎</span><input id="q" placeholder="Uçak, tıp, İngilizce, şınav…" autocomplete="off"></div>
    <div id="alanList"></div>
  </div>
</section>

<!-- BEN -->
<section class="scr list" id="s-ben">
  <div class="wrap">
    <div class="top"><div class="grow"><h1>Ben</h1><div class="sub" id="lvlTxt">Seviye 1</div></div></div>
    <div class="blk">
      <div style="display:flex;justify-content:space-between;font-size:.86rem;color:var(--dim)">
        <span id="xpTxt">0 XP</span><span id="nextTxt"></span></div>
      <div class="bar"><i id="xpBar" style="background:linear-gradient(90deg,#6ea8ff,#b18cff)"></i></div>
      <div class="line" style="border-top:1px solid rgba(255,255,255,.06);margin-top:8px">
        <span>Tamamlanan konu</span><b id="stDone">0 / 1000</b></div>
      <div class="line"><span>Kazanılan oyun</span><b id="stWin">0</b></div>
      <div class="line"><span>Seri</span><b id="stStreak">0 gün</b></div>
    </div>
    <div class="blk"><h2>Gruplar</h2><div id="grpBars"></div></div>
    <div class="blk"><h2>Ayarlar</h2>
      <div class="line"><span>Ses</span><button class="chip" id="sndBtn">Açık</button></div>
      <div class="line"><span>İlerlemeyi sıfırla</span><button class="chip" id="resetBtn">Sıfırla</button></div>
    </div>
  </div>
</section>

<!-- 3B MOD -->
<section class="scr" id="s-3d">
  <div id="stage3d"><div id="globe"></div></div>
  <div id="d3top">
    <button class="bk" id="d3back" style="display:none">←</button>
    <div class="pill" id="d3title">🧊 3B Keşif</div>
    <div style="flex:1"></div>
    <button class="pill" id="d3shuffle">🎲</button>
  </div>
  <div id="d3chips"></div>
  <div id="d3info"><b id="d3name">Küreyi döndür</b><span id="d3sub">Sürükle · bir alana dokun</span></div>
</section>

<!-- OYUN -->
<section class="scr" id="oyun">
  <canvas id="gcanvas"></canvas>
  <div id="gtop">
    <button class="bk" id="gBack" style="background:rgba(0,0,0,.4)">←</button>
    <div class="t" id="gTitle"></div>
    <button class="bk" id="gRetry" style="background:rgba(0,0,0,.4)">↻</button>
  </div>
  <div id="ghint"></div>
</section>

<nav id="nav">
  <button class="on" data-s="dunya"><span>🌍</span><em>Dünya</em></button>
  <button data-s="harita"><span>🗺️</span><em>Harita</em></button>
  <button data-s="3d"><span>🧊</span><em>3B</em></button>
  <button data-s="liste"><span>📚</span><em>Alanlar</em></button>
  <button data-s="ben"><span>🌱</span><em>Ben</em></button>
</nav>

<div id="sonuc"><div id="sheet"></div></div>
<div id="toast"></div>

<script src="data-alan.js?v=6"></script>
<script src="data-spor.js?v=6"></script>
<script src="data-dil.js?v=6"></script>
<script src="games.js?v=6"></script>
<script src="world.js?v=6"></script>
<script>
/* ============ VERİYİ BİRLEŞTİR ============ */
const ALAN = [
  ...ALANLAR,
  ...SPOR_ALANLAR,
  ...DILLER.map(d => ({id: 'dil_' + d.id, n: d.n, e: d.e, g: 'dil', skin: 'word', a: d.a, b: d.b, grp: 'Dil'}))
];
const KONU = {};
Object.assign(KONU, KONULAR, SPOR_KONULAR);
for (const d of DILLER) {
  KONU['dil_' + d.id] = DIL_TEMALAR.map((tema, i) => {
    const w = (d.t[i] || '').split('|').map(s => s.split('='));
    return [tema, w.map(p => p[0] + ' → ' + p[1]).join('  ·  '), w];
  });
}
const ALANOF = Object.fromEntries(ALAN.map(a => [a.id, a]));
const TOPLAM = ALAN.reduce((s, a) => s + (KONU[a.id] || []).length, 0);
const GRUPLAR = [...new Set(ALAN.map(a => a.grp))];

/* ============ DURUM ============ */
const KEY = 'gelisim-dunyasi-v3';
const S = Object.assign({done: [], xp: 0, wins: 0, streak: 0, last: '', snd: 1, px: 0, py: 0},
  JSON.parse(localStorage.getItem(KEY) || '{}'));
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const bugun = () => new Date().toISOString().slice(0, 10);
const doneSet = new Set(S.done);
const key = (a, i) => a + ':' + i;
const isDone = (a, i) => doneSet.has(key(a, i));
const alanDone = a => (KONU[a] || []).filter((_, i) => isDone(a, i)).length;

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2300); }

/* ============ SES ============ */
let AC = null;
function sfx(kind) {
  if (!S.snd) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const map = {ok: [660, .16, 'triangle', .07], bad: [150, .2, 'sawtooth', .05], tick: [420, .05, 'square', .035],
      note0: [392, .16, 'sine', .07], note1: [494, .16, 'sine', .07], note2: [587, .16, 'sine', .07], note3: [784, .16, 'sine', .07]};
    const [f, d, t, v] = map[kind] || map.tick;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = t; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(v, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d);
    o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => { if (S.snd) sfx('ok'); }, i * 95));

/* ============ EKRAN GEÇİŞİ ============ */
let ekran = 'dunya';
function go(id) {
  const onceki = ekran;
  ekran = id;
  $$('.scr').forEach(s => s.classList.toggle('on', s.id === 's-' + id || s.id === id));
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.s === id));
  $('#nav').classList.toggle('hide', id === 'oyun' || id === 'alan');
  $('#stick').classList.toggle('on', id === 'harita');
  if (onceki === 'dunya' && id !== 'dunya') { if (document.pointerLockElement) document.exitPointerLock(); if (wHazir) girdiSifirla(); }
  if (id === 'dunya') dunyaAc();
  if (id === 'liste') buildListe();
  if (id === 'ben') buildBen();
  if (id === '3d') open3D();
  if (id === 'harita') { $('#tip').classList.add('on'); setTimeout(() => $('#tip').classList.remove('on'), 3200); }
}
$$('#nav button').forEach(b => b.onclick = () => { go(b.dataset.s); sfx('tick'); });

/* ============ HARİTA (oynanabilir) ============ */
const map = $('#map'), mc = map.getContext('2d');
let MW = 0, MH = 0;
const WORLD = {w: 4400, h: 4000};
const nodes = [], kume = [];
(function layout() {
  const cx = WORLD.w / 2, cy = WORLD.h / 2, TAU = Math.PI * 2, GAP = 165;
  GRUPLAR.forEach((grp, gi) => {
    const list = ALAN.filter(a => a.grp === grp);
    const ang = gi / GRUPLAR.length * TAU - Math.PI / 2;
    const gx = cx + Math.cos(ang) * 1420, gy = cy + Math.sin(ang) * 1420;
    let i = 0, ring = 0, rmax = 0;
    while (i < list.length) {
      const rr = ring * GAP;
      const cap = ring === 0 ? 1 : Math.max(6, Math.floor(TAU * rr / GAP));
      for (let k = 0; k < cap && i < list.length; k++, i++) {
        const th = ring === 0 ? 0 : (k / cap) * TAU + ring * .7;
        nodes.push({a: list[i], x: gx + Math.cos(th) * rr, y: gy + Math.sin(th) * rr, ph: Math.random() * 6, grp});
      }
      rmax = rr; ring++;
    }
    kume.push({grp, x: gx, y: gy, r: rmax + GAP, col: list[0].a});
  });
})();
const P = {x: S.px || kume[0].x, y: S.py || kume[0].y + 40, vx: 0, vy: 0, ang: 0};
const cam = {x: 0, y: 0};
const stars = Array.from({length: 220}, () => ({x: Math.random() * WORLD.w, y: Math.random() * WORLD.h, r: Math.random() * 1.7 + .3, d: Math.random()}));
let near = null, kmap = {};
addEventListener('keydown', e => { kmap[e.key] = 1; if ([' ', 'Enter'].includes(e.key) && near && ekran === 'harita') { aktifAlanFrom = 'harita'; openAlan(near.a.id); } });
addEventListener('keyup', e => kmap[e.key] = 0);

/* sanal joystick */
let stick = null;
const stEl = $('#stick'), stKnob = stEl.querySelector('i');
function stickStart(e) {
  if (ekran !== 'harita') return;
  const t = e.touches ? e.touches[0] : e;
  stick = {ox: t.clientX, oy: t.clientY, dx: 0, dy: 0};
  stEl.style.left = (t.clientX - 59) + 'px';
  stEl.style.top = (t.clientY - 59) + 'px';
  stEl.style.bottom = 'auto';
}
function stickMove(e) {
  if (!stick) return;
  const t = e.touches ? e.touches[0] : e;
  let dx = t.clientX - stick.ox, dy = t.clientY - stick.oy;
  const d = Math.hypot(dx, dy), max = 52;
  if (d > max) { dx = dx / d * max; dy = dy / d * max; }
  stick.dx = dx / max; stick.dy = dy / max;
  stKnob.style.transform = `translate(${dx}px,${dy}px)`;
}
function stickEnd() { stick = null; stKnob.style.transform = ''; stEl.style.left = '22px'; stEl.style.top = 'auto'; stEl.style.bottom = 'calc(26px + var(--sb))'; }
map.addEventListener('pointerdown', e => { map.setPointerCapture(e.pointerId); stickStart(e); });
map.addEventListener('pointermove', stickMove);
map.addEventListener('pointerup', stickEnd);
map.addEventListener('pointercancel', stickEnd);

function resizeAll() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  [map, $('#gcanvas')].forEach(cv => {
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  });
  MW = innerWidth; MH = innerHeight;
}
addEventListener('resize', resizeAll); resizeAll();

let tick = 0;
function mapLoop() {
  requestAnimationFrame(mapLoop);
  if (ekran !== 'harita') return;
  tick++;
  // hareket
  let ax = 0, ay = 0;
  if (stick) { ax = stick.dx; ay = stick.dy; }
  if (kmap.ArrowLeft || kmap.a) ax = -1;
  if (kmap.ArrowRight || kmap.d) ax = 1;
  if (kmap.ArrowUp || kmap.w) ay = -1;
  if (kmap.ArrowDown || kmap.s) ay = 1;
  P.vx = (P.vx + ax * .85) * .92;
  P.vy = (P.vy + ay * .85) * .92;
  P.x = Math.max(40, Math.min(WORLD.w - 40, P.x + P.vx));
  P.y = Math.max(40, Math.min(WORLD.h - 40, P.y + P.vy));
  if (Math.hypot(P.vx, P.vy) > .4) P.ang = Math.atan2(P.vy, P.vx);
  cam.x += (P.x - MW / 2 - cam.x) * .1;
  cam.y += (P.y - MH / 2 - cam.y) * .1;

  // yakın düğüm
  let best = null, bd = 1e9;
  for (const n of nodes) { const d = Math.hypot(P.x - n.x, P.y - n.y); if (d < 96 && d < bd) { bd = d; best = n; } }
  if (best !== near) {
    near = best;
    const btn = $('#enter');
    if (near) {
      btn.classList.add('on');
      $('#enterIc').textContent = near.a.e;
      $('#enterTx').textContent = near.a.n;
      sfx('tick');
    } else btn.classList.remove('on');
  }
  drawMap();
  if (tick % 90 === 0) { S.px = P.x; S.py = P.y; save(); }
}
function drawMap() {
  const c = mc;
  const bg = c.createLinearGradient(0, 0, 0, MH);
  bg.addColorStop(0, '#0b1024'); bg.addColorStop(1, '#04060d');
  c.fillStyle = bg; c.fillRect(0, 0, MW, MH);
  // yıldızlar
  for (const s of stars) {
    const px = s.x - cam.x * (.4 + s.d * .5), py = s.y - cam.y * (.4 + s.d * .5);
    if (px < -10 || px > MW + 10 || py < -10 || py > MH + 10) continue;
    c.globalAlpha = .25 + s.d * .6; c.fillStyle = '#fff';
    c.fillRect(px, py, s.r, s.r);
  }
  c.globalAlpha = 1;
  // grup halesi
  for (const k of kume) {
    const mx = k.x - cam.x, my = k.y - cam.y;
    if (mx < -k.r - 200 || mx > MW + k.r + 200 || my < -k.r - 200 || my > MH + k.r + 200) continue;
    const gr = c.createRadialGradient(mx, my, 20, mx, my, k.r);
    gr.addColorStop(0, k.col + '2e'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = gr; c.beginPath(); c.arc(mx, my, k.r, 0, 6.3); c.fill();
    c.fillStyle = 'rgba(255,255,255,.3)'; c.textAlign = 'center';
    c.font = '800 14px -apple-system,system-ui,sans-serif';
    c.fillText(k.grp.toUpperCase(), mx, my - k.r + 26);
  }
  // düğümler
  for (const n of nodes) {
    const x = n.x - cam.x, y = n.y - cam.y;
    if (x < -80 || x > MW + 80 || y < -80 || y > MH + 80) continue;
    n.ph += .02;
    const tot = (KONU[n.a.id] || []).length, dn = alanDone(n.a.id);
    const r = 26 + Math.sin(n.ph) * 1.6 + (near === n ? 6 : 0);
    const gr = c.createRadialGradient(x, y, 0, x, y, r * 2.6);
    gr.addColorStop(0, n.a.a + '55'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = gr; c.beginPath(); c.arc(x, y, r * 2.6, 0, 6.3); c.fill();
    const g2 = c.createLinearGradient(x - r, y - r, x + r, y + r);
    g2.addColorStop(0, n.a.a); g2.addColorStop(1, n.a.b);
    c.fillStyle = g2; c.beginPath(); c.arc(x, y, r, 0, 6.3); c.fill();
    if (dn) {
      c.strokeStyle = '#5ce6a0'; c.lineWidth = 3.4;
      c.beginPath(); c.arc(x, y, r + 5, -Math.PI / 2, -Math.PI / 2 + 6.283 * dn / tot); c.stroke();
    }
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#0a0f1c';
    if (n.a.grp === 'Dil') { // bayrak emojisi her cihazda çizilmiyor → kod yazısı
      c.font = '800 ' + Math.round(r * .62) + 'px -apple-system,system-ui,sans-serif';
      c.fillText(n.a.id.slice(4).toUpperCase(), x, y + 1);
    } else {
      c.fillStyle = '#fff';
      c.font = (r * .92) + 'px -apple-system,system-ui,sans-serif';
      c.fillText(n.a.e, x, y + 1);
    }
    c.fillStyle = near === n ? '#fff' : 'rgba(255,255,255,.62)';
    c.font = (near === n ? '800 12px ' : '700 11px ') + '-apple-system,system-ui,sans-serif';
    c.fillText(n.a.n, x, y + r + 16);
  }
  // oyuncu gemisi
  const px = P.x - cam.x, py = P.y - cam.y;
  c.save(); c.translate(px, py); c.rotate(P.ang);
  const th = Math.hypot(P.vx, P.vy);
  if (th > .3) {
    const fg = c.createLinearGradient(-14, 0, -14 - th * 6, 0);
    fg.addColorStop(0, '#ffb35c'); fg.addColorStop(1, 'rgba(255,120,0,0)');
    c.fillStyle = fg;
    c.beginPath(); c.moveTo(-13, -5); c.lineTo(-13 - th * 7, 0); c.lineTo(-13, 5); c.closePath(); c.fill();
  }
  c.fillStyle = '#e8eeff';
  c.beginPath(); c.moveTo(20, 0); c.quadraticCurveTo(2, -9, -13, -7);
  c.lineTo(-13, 7); c.quadraticCurveTo(2, 9, 20, 0); c.closePath(); c.fill();
  c.fillStyle = '#93a6d6';
  c.beginPath(); c.moveTo(-2, -7); c.lineTo(-12, -16); c.lineTo(-14, -7); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(-2, 7); c.lineTo(-12, 16); c.lineTo(-14, 7); c.closePath(); c.fill();
  c.fillStyle = '#4fd1ff'; c.beginPath(); c.arc(6, 0, 4.2, 0, 6.3); c.fill();
  c.restore();
}
mapLoop();

$('#enter').onclick = () => { if (near) { aktifAlanFrom = 'harita'; openAlan(near.a.id); } };
$('#findBtn').onclick = () => { go('liste'); sfx('tick'); };

/* ============ ALAN EKRANI ============ */
let aktifAlan = null;
function openAlan(id) {
  aktifAlan = id;
  const a = ALANOF[id], list = KONU[id] || [];
  document.documentElement.style.setProperty('--a1', a.a);
  document.documentElement.style.setProperty('--a2', a.b);
  $('#alanAd').textContent = a.e + '  ' + a.n;
  const dn = alanDone(id);
  $('#alanSub').textContent = `${a.grp} · ${dn}/${list.length} konu · oyun: ${GAMES[a.g].ad}`;
  $('#alanBar').style.width = (dn / list.length * 100) + '%';
  $('#alanBar').style.background = `linear-gradient(90deg,${a.a},${a.b})`;
  $('#konuList').innerHTML = list.map((k, i) => `
    <button class="row${isDone(id, i) ? ' done' : ''}" data-i="${i}">
      <span class="ic" style="background:linear-gradient(150deg,${a.a},${a.b})">${isDone(id, i) ? '✓' : i + 1}</span>
      <span class="tx"><b>${k[0]}</b><span>${isDone(id, i) ? k[1] : 'Oyunu kazan, bilgiyi aç'}</span></span>
      <span class="ck">▶</span></button>`).join('');
  $$('#konuList .row').forEach(b => b.onclick = () => { oyunKaynak = aktifAlanFrom === 'dunya' ? 'dunya' : 'alan'; startGame(id, +b.dataset.i); });
  go('alan');
  sfx('tick');
}
$('#alanBack').onclick = () => go(aktifAlanFrom || 'harita');
let aktifAlanFrom = 'harita';

/* ============ LİSTE ============ */
function buildListe(filter = '') {
  const f = filter.trim().toLowerCase();
  const el = $('#alanList');
  $('#listeSub').textContent = `${ALAN.length} alan · ${TOPLAM} konu · ${S.done.length} tamamlandı`;
  let html = '';
  for (const grp of GRUPLAR) {
    const list = ALAN.filter(a => a.grp === grp && (!f || (a.n + ' ' + a.grp).toLowerCase().includes(f)));
    if (!list.length) continue;
    html += `<div class="grouphead">${grp}</div>`;
    html += list.map(a => {
      const tot = (KONU[a.id] || []).length, dn = alanDone(a.id);
      return `<button class="row${dn === tot ? ' done' : ''}" data-a="${a.id}">
        <span class="ic" style="background:linear-gradient(150deg,${a.a},${a.b})">${a.e}</span>
        <span class="tx"><b>${a.n}</b><span>${dn}/${tot} konu · ${GAMES[a.g].ad}</span></span>
        <span class="ck">${dn === tot ? '✓' : '›'}</span></button>`;
    }).join('');
  }
  el.innerHTML = html || '<div class="empty">Sonuç yok.</div>';
  $$('#alanList .row').forEach(b => b.onclick = () => { aktifAlanFrom = 'liste'; openAlan(b.dataset.a); });
}
$('#q').addEventListener('input', e => buildListe(e.target.value));

/* ============ BEN ============ */
function buildBen() {
  const lvl = Math.floor(S.xp / 100) + 1, into = S.xp % 100;
  $('#lvlTxt').textContent = 'Seviye ' + lvl;
  $('#xpTxt').textContent = S.xp + ' XP';
  $('#nextTxt').textContent = (100 - into) + ' XP’de seviye ' + (lvl + 1);
  $('#xpBar').style.width = into + '%';
  $('#stDone').textContent = S.done.length + ' / ' + TOPLAM;
  $('#stWin').textContent = S.wins;
  $('#stStreak').textContent = S.streak + ' gün';
  $('#grpBars').innerHTML = GRUPLAR.map(grp => {
    const list = ALAN.filter(a => a.grp === grp);
    const tot = list.reduce((s, a) => s + (KONU[a.id] || []).length, 0);
    const dn = list.reduce((s, a) => s + alanDone(a.id), 0);
    return `<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:.86rem">
      <span>${grp}</span><span style="color:var(--dim)">${dn}/${tot}</span></div>
      <div class="bar"><i style="width:${dn / tot * 100}%;background:linear-gradient(90deg,${list[0].a},${list[0].b})"></i></div></div>`;
  }).join('');
  $('#sndBtn').textContent = S.snd ? 'Açık' : 'Kapalı';
  $('#lvlPill').textContent = '⭐ Sv ' + lvl;
}
$('#sndBtn').onclick = () => { S.snd = S.snd ? 0 : 1; save(); buildBen(); if (S.snd) sfx('ok'); };
$('#resetBtn').onclick = () => { if (confirm('Tüm ilerlemen silinecek. Emin misin?')) { localStorage.removeItem(KEY); location.reload(); } };

/* ============ VOXEL DÜNYA ============ */
const wc = $('#wcanvas');
let wHazir = false, wRAF = null, wKule = null;
const SLOTLAR = [1, 3, 4, 5, 9, 10, 13, 14, 12];   // çim, taş, kum, odun, tahta, cam, tuğla, obsidyen, lamba
const BLOK_RENK = {1:'#6aaa50', 2:'#866043', 3:'#808082', 4:'#dbcd96', 5:'#684e2f', 6:'#3f7a3a',
  8:'#f2f6fc', 9:'#b08b5c', 10:'#a8d4f0', 11:'#ffcf3d', 12:'#ffe89a', 13:'#964c42', 14:'#3a2c52'};
const ODUL_BLOK = {'Mühendislik':13, 'Sağlık':12, 'Bilim':14, 'Doğa':5, 'Sosyal':9, 'Spor':11, 'Dil':10};
S.env = S.env || {1:64, 3:64, 4:32, 5:32, 9:64, 10:16, 13:32, 14:8, 12:8};
S.slot = S.slot || 0;

function envanterCiz() {
  $('#hotbar').innerHTML = SLOTLAR.map((id, i) => `
    <button class="slot${i === S.slot ? ' on' : ''}" data-i="${i}" title="${W.BDEF[id].ad}">
      <i style="background:${BLOK_RENK[id]}"></i><b>${S.env[id] || 0}</b></button>`).join('');
  $$('#hotbar .slot').forEach(b => b.onclick = () => { S.slot = +b.dataset.i; envanterCiz(); sfx('tick'); });
}
function wmsg(t) { const e = $('#wmsg'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2600); }

function dunyaAc() {
  if (!wHazir) {
    const ok = W.init(wc, ALAN, S.dunya || null, {
      kule(k) {
        wKule = k;
        const btn = $('#kulePrompt');
        if (k) {
          const a = k.a, dn = alanDone(a.id), tot = KONU[a.id].length;
          document.documentElement.style.setProperty('--a1', a.a);
          document.documentElement.style.setProperty('--a2', a.b);
          $('#kuleIc').textContent = a.grp === 'Dil' ? '🗣️' : a.e;
          $('#kuleTx').textContent = `${a.n}  ${dn}/${tot}`;
          btn.classList.add('on');
          sfx('note2');
        } else btn.classList.remove('on');
      }
    });
    if (!ok) { wmsg('Bu cihazda WebGL yok — Harita moduna geç.'); return; }
    wHazir = true;
    W.mesafe = matchMedia('(pointer:coarse)').matches ? 4 : 5;
    envanterCiz();
  }
  W.boyut();
  if (!wRAF) wLoop(performance.now());
}
let wSay = 0;
function wLoop(t) {
  if (ekran !== 'dunya') { wRAF = null; return; }
  wRAF = requestAnimationFrame(wLoop);
  W.kare(t);
  if (++wSay % 12 === 0) {
    const p = W.P;
    $('#wstat').textContent = `${Math.floor(p.x)} ${Math.floor(p.y)} ${Math.floor(p.z)} · ${W.biyom(Math.floor(p.x), Math.floor(p.z))} · ${W.fps}fps${p.ucus ? ' · ✈' : ''}`;
  }
  if (wSay % 900 === 0) { S.dunya = W.kaydet(); save(); }
}
addEventListener('resize', () => { if (wHazir) W.boyut(); });

/* --- blok kır / koy --- */
function kir() {
  const h = W.isin();
  if (!h) return;
  if (h.id === W.B.LAMBA || h.id === W.B.OBSIDYEN) {
    // kule yapısı kırılmasın
    if (W.KULE.some(k => Math.abs(k.x - h.x) <= 3 && Math.abs(k.z - h.z) <= 3)) { wmsg('Bilgi Kulesi kırılamaz'); return; }
  }
  W.blokKoy(h.x, h.y, h.z, 0);
  if (SLOTLAR.includes(h.id)) { S.env[h.id] = (S.env[h.id] || 0) + 1; envanterCiz(); }
  else if (h.id === 11) { S.env[11] = (S.env[11] || 0) + 1; }
  sfx('tick'); save();
}
function koy() {
  const h = W.isin();
  if (!h || !h.once) return;
  const id = SLOTLAR[S.slot];
  if (!S.env[id]) { wmsg(W.BDEF[id].ad + ' bitti — kırarak topla'); return; }
  const p = W.P, o = h.once;
  // oyuncunun içine koyma
  if (Math.floor(p.x) === o.x && Math.floor(p.z) === o.z && (Math.floor(p.y) === o.y || Math.floor(p.y + 1.7) === o.y)) return;
  W.blokKoy(o.x, o.y, o.z, id);
  S.env[id]--; envanterCiz(); sfx('ok'); save();
}
$('#bKir').onclick = kir;
$('#bKoy').onclick = koy;
$('#bZipla').addEventListener('pointerdown', () => W.girdi.zipla = 1);
$('#bZipla').addEventListener('pointerup', () => W.girdi.zipla = 0);
$('#bUc').onclick = () => { W.P.ucus = !W.P.ucus; W.P.vy = 0; wmsg(W.P.ucus ? '✈ Uçuş açık' : 'Uçuş kapalı'); sfx('note1'); };
$('#wPusula').onclick = () => {
  // en yakın tamamlanmamış kuleye ışınla
  const p = W.P;
  let best = null, bd = 1e18;
  for (const k of W.KULE) {
    if (alanDone(k.a.id) >= KONU[k.a.id].length) continue;
    const d = (k.x - p.x) ** 2 + (k.z - p.z) ** 2;
    if (d < bd) { bd = d; best = k; }
  }
  if (!best) { wmsg('Tüm kuleler tamamlandı 🎉'); return; }
  W.isinlaKule(best);
  wmsg('🧭 ' + best.a.n + ' kulesine ışınlandın');
  sfx('ok');
};
$('#kulePrompt').onclick = () => { if (wKule) { aktifAlanFrom = 'dunya'; oyunKaynak = 'dunya'; openAlan(wKule.a.id); } };

/* --- klavye --- */
const KHAR = {KeyW:'ileri', KeyS:'ileri', KeyA:'sag', KeyD:'sag', ArrowUp:'ileri', ArrowDown:'ileri', ArrowLeft:'sag', ArrowRight:'sag'};
addEventListener('keydown', e => {
  if (ekran !== 'dunya') return;
  const g = W.girdi;
  if (e.code === 'KeyW' || e.code === 'ArrowUp') g.ileri = 1;
  else if (e.code === 'KeyS' || e.code === 'ArrowDown') g.ileri = -1;
  else if (e.code === 'KeyA' || e.code === 'ArrowLeft') g.sag = -1;
  else if (e.code === 'KeyD' || e.code === 'ArrowRight') g.sag = 1;
  else if (e.code === 'Space') { g.zipla = 1; e.preventDefault(); }
  else if (e.code === 'ShiftLeft') g.kos = 1;
  else if (e.code === 'ControlLeft') g.in = 1;
  else if (e.code === 'KeyF') { W.P.ucus = !W.P.ucus; W.P.vy = 0; wmsg(W.P.ucus ? '✈ Uçuş açık' : 'Uçuş kapalı'); }
  else if (e.code === 'KeyE') { if (wKule) { aktifAlanFrom = 'dunya'; oyunKaynak = 'dunya'; openAlan(wKule.a.id); } }
  else if (e.code >= 'Digit1' && e.code <= 'Digit9') { S.slot = +e.code.slice(5) - 1; envanterCiz(); }
});
addEventListener('keyup', e => {
  if (ekran !== 'dunya') return;
  const g = W.girdi;
  if (e.code === 'KeyW' || e.code === 'KeyS' || e.code === 'ArrowUp' || e.code === 'ArrowDown') g.ileri = 0;
  if (e.code === 'KeyA' || e.code === 'KeyD' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') g.sag = 0;
  if (e.code === 'Space') g.zipla = 0;
  if (e.code === 'ShiftLeft') g.kos = 0;
  if (e.code === 'ControlLeft') g.in = 0;
});
/* odak kaybolunca tuşlar basılı kalmasın */
function girdiSifirla() { const g = W.girdi; g.ileri = 0; g.sag = 0; g.zipla = 0; g.in = 0; g.kos = 0; }
addEventListener('blur', girdiSifirla);
addEventListener('visibilitychange', () => { if (document.hidden) girdiSifirla(); });

/* --- fare (pointer lock) --- */
wc.addEventListener('mousedown', e => {
  if (!document.pointerLockElement) { wc.requestPointerLock(); return; }
  if (e.button === 0) kir(); else if (e.button === 2) koy();
});
wc.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousemove', e => {
  if (document.pointerLockElement !== wc) return;
  W.P.yaw -= e.movementX * .0026;
  W.P.pitch = Math.max(-1.54, Math.min(1.54, W.P.pitch - e.movementY * .0026));
});
addEventListener('wheel', e => {
  if (ekran !== 'dunya' || !document.pointerLockElement) return;
  S.slot = (S.slot + (e.deltaY > 0 ? 1 : -1) + SLOTLAR.length) % SLOTLAR.length;
  envanterCiz();
}, {passive: true});

/* --- dokunmatik: sol yarı yürüyüş, sağ yarı bakış --- */
const stEl2 = $('#wstick'), stKnob2 = stEl2.querySelector('i');
let pMove = null, pLook = null;
wc.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  wc.setPointerCapture(e.pointerId);
  if (e.clientX < innerWidth * .45 && pMove === null) {
    pMove = {id: e.pointerId, ox: e.clientX, oy: e.clientY};
    stEl2.style.left = (e.clientX - 56) + 'px';
    stEl2.style.top = (e.clientY - 56) + 'px';
    stEl2.style.bottom = 'auto';
  } else if (pLook === null) {
    pLook = {id: e.pointerId, x: e.clientX, y: e.clientY, hareket: 0, t: performance.now()};
  }
});
wc.addEventListener('pointermove', e => {
  if (pMove && e.pointerId === pMove.id) {
    let dx = e.clientX - pMove.ox, dy = e.clientY - pMove.oy;
    const d = Math.hypot(dx, dy), max = 48;
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    stKnob2.style.transform = `translate(${dx}px,${dy}px)`;
    W.girdi.ileri = -dy / max;
    W.girdi.sag = dx / max;
    W.girdi.kos = d > max * .85 ? 1 : 0;
  } else if (pLook && e.pointerId === pLook.id) {
    const dx = e.clientX - pLook.x, dy = e.clientY - pLook.y;
    pLook.x = e.clientX; pLook.y = e.clientY;
    pLook.hareket += Math.abs(dx) + Math.abs(dy);
    W.P.yaw -= dx * .0052;
    W.P.pitch = Math.max(-1.54, Math.min(1.54, W.P.pitch - dy * .0052));
  }
});
const bitirW = e => {
  if (pMove && e.pointerId === pMove.id) {
    pMove = null; stKnob2.style.transform = '';
    stEl2.style.left = '24px'; stEl2.style.top = 'auto'; stEl2.style.bottom = 'calc(120px + var(--sb))';
    W.girdi.ileri = 0; W.girdi.sag = 0; W.girdi.kos = 0;
  } else if (pLook && e.pointerId === pLook.id) {
    if (pLook.hareket < 10 && performance.now() - pLook.t < 260) kir();   // kısa dokunuş = kır
    pLook = null;
  }
};
wc.addEventListener('pointerup', bitirW);
wc.addEventListener('pointercancel', bitirW);

/* ============ 3B MOD ============ */
const D3 = {mode: 'kure', rx: -8, ry: 0, vrx: 0, vry: .06, z: 0, alan: null, drag: null, moved: 0, filtre: null, raf: null, R: 300};
const stage = $('#stage3d'), globe = $('#globe');
const cl = (v, a, b) => v < a ? a : v > b ? b : v;

function buildKure() {
  const N = ALAN.length, R = Math.max(250, Math.min(Math.min(innerWidth, innerHeight) * .58, 430));
  D3.R = R; D3.z0 = -(R - 140);
  const GOLD = Math.PI * (1 + Math.sqrt(5));
  globe.innerHTML = ALAN.map((a, i) => {
    const phi = Math.acos(1 - 2 * (i + .5) / N);
    const lat = 90 - phi * 180 / Math.PI;
    const lon = (GOLD * (i + .5)) * 180 / Math.PI % 360;
    const tot = (KONU[a.id] || []).length, dn = alanDone(a.id);
    const w = 74;
    return `<div class="t3" data-a="${a.id}" data-lat="${lat.toFixed(2)}" data-lon="${lon.toFixed(2)}"
      style="width:${w}px;height:${w}px;margin:${-w / 2}px 0 0 ${-w / 2}px;
      background:linear-gradient(150deg,${a.a},${a.b});
      transform:rotateY(${lon}deg) rotateX(${-lat}deg) translateZ(${R}px)">
      ${a.grp === 'Dil' ? `<div class="code">${a.id.slice(4).toUpperCase()}</div>` : `<div class="e">${a.e}</div>`}
      <div class="n">${a.n}</div>${dn ? `<div class="ok">${dn}/${tot}</div>` : ''}</div>`;
  }).join('');
  applyFiltre();
}
function buildHalka(id) {
  const list = KONU[id], a = ALANOF[id], n = list.length;
  const cw = 136, ch = 152;
  const R = Math.max(235, (cw + 18) * n / (2 * Math.PI));
  D3.R = R; D3.z0 = -(R - 165);
  globe.innerHTML = list.map((k, i) => {
    const ang = i / n * 360, done = isDone(id, i);
    return `<div class="k3" data-i="${i}" style="width:${cw}px;height:${ch}px;margin:${-ch / 2}px 0 0 ${-cw / 2}px;
      background:linear-gradient(155deg,${a.a},${a.b});opacity:${done ? .82 : 1};
      transform:rotateY(${ang}deg) translateZ(${R}px)">
      <div class="num">${i + 1} / ${n}</div><div class="ttl">${k[0]}</div>
      <div class="st">${done ? '✓ tamamlandı' : '▶ oyna'}</div></div>`;
  }).join('');
}
function applyFiltre() {
  $$('#globe .t3').forEach(el => el.classList.toggle('dim', !!D3.filtre && ALANOF[el.dataset.a].grp !== D3.filtre));
}
function apply3D() {
  globe.style.transform = `translateZ(${(D3.z0 || 0) + D3.z}px) rotateX(${D3.rx}deg) rotateY(${D3.ry}deg)`;
}
function loop3D() {
  if (ekran !== '3d') { D3.raf = null; return; }
  D3.raf = requestAnimationFrame(loop3D);
  if (!D3.drag) {
    D3.ry += D3.vry; D3.rx += D3.vrx;
    D3.vry *= .95; D3.vrx *= .95;
    if (D3.mode === 'kure') { if (Math.abs(D3.vry) < .055) D3.vry = .055; }
    else if (Math.abs(D3.vry) < .01) D3.vry = 0;
    D3.rx = cl(D3.rx, D3.mode === 'kure' ? -68 : -22, D3.mode === 'kure' ? 68 : 22);
  }
  // halkada öne gelen kartı vurgula
  if (D3.mode === 'halka' && D3.alan) {
    const list = KONU[D3.alan], n = list.length, adim = 360 / n;
    const idx = ((Math.round(-D3.ry / adim) % n) + n) % n;
    if (idx !== D3.front) {
      D3.front = idx;
      $$('#globe .k3').forEach((el, i) => el.classList.toggle('front', i === idx));
      $('#d3name').textContent = list[idx][0];
      $('#d3sub').textContent = `${idx + 1}/${n} · ${isDone(D3.alan, idx) ? 'tamamlandı' : GAMES[ALANOF[D3.alan].g].ad + ' oyunu'} · karta dokun`;
      sfx('tick');
    }
  }
  apply3D();
}
function open3D() {
  if (D3.mode === 'halka' && D3.alan) buildHalka(D3.alan); else { D3.mode = 'kure'; buildKure(); }
  apply3D();
  if (!D3.raf) loop3D();
}
function gir3D(id) {
  D3.alan = id; D3.mode = 'halka'; D3.rx = -6; D3.ry = 0; D3.z = 0; D3.vry = 0; D3.vrx = 0; D3.front = -1;
  buildHalka(id);
  const a = ALANOF[id];
  document.documentElement.style.setProperty('--a1', a.a);
  document.documentElement.style.setProperty('--a2', a.b);
  $('#d3back').style.display = 'grid';
  $('#d3title').textContent = a.e + ' ' + a.n;
  $('#d3name').textContent = a.n;
  $('#d3sub').textContent = `${alanDone(id)}/${KONU[id].length} konu · ${GAMES[a.g].ad} oyunu · karta dokun`;
  $('#d3chips').style.display = 'none';
  sfx('ok');
}
function geri3D() {
  D3.mode = 'kure'; D3.alan = null; D3.rx = -8; D3.z = 0; D3.vry = .06;
  buildKure();
  $('#d3back').style.display = 'none';
  $('#d3title').textContent = '🧊 3B Keşif';
  $('#d3name').textContent = 'Küreyi döndür';
  $('#d3sub').textContent = 'Sürükle · bir alana dokun';
  $('#d3chips').style.display = 'flex';
  sfx('tick');
}
$('#d3back').onclick = geri3D;
$('#d3shuffle').onclick = () => {
  const a = ALAN[Math.floor(Math.random() * ALAN.length)];
  const i = Math.floor(Math.random() * KONU[a.id].length);
  oyunKaynak = '3d'; D3.alan = a.id; D3.mode = 'halka';
  startGame(a.id, i);
};
// grup çipleri
$('#d3chips').innerHTML = '<button data-g="" class="on">Tümü</button>' + GRUPLAR.map(g => `<button data-g="${g}">${g}</button>`).join('');
$$('#d3chips button').forEach(b => b.onclick = () => {
  $$('#d3chips button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  D3.filtre = b.dataset.g || null;
  applyFiltre();
  if (D3.filtre) {
    const el = $$('#globe .t3').find(e => ALANOF[e.dataset.a].grp === D3.filtre);
    if (el) { D3.ry = -(+el.dataset.lon); D3.rx = +el.dataset.lat; D3.vry = 0; D3.vrx = 0; apply3D(); }
  }
  sfx('tick');
});
// sürükle
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  D3.drag = {x: e.clientX, y: e.clientY}; D3.moved = 0; D3.vry = 0; D3.vrx = 0;
});
stage.addEventListener('pointermove', e => {
  if (!D3.drag) return;
  const dx = e.clientX - D3.drag.x, dy = e.clientY - D3.drag.y;
  D3.drag.x = e.clientX; D3.drag.y = e.clientY;
  D3.moved += Math.abs(dx) + Math.abs(dy);
  D3.ry += dx * .28; D3.vry = dx * .28;
  if (D3.mode === 'kure') { D3.rx -= dy * .2; D3.vrx = -dy * .2; }
  apply3D();
});
const bitirDrag = () => { D3.drag = null; };
stage.addEventListener('pointerup', bitirDrag);
stage.addEventListener('pointercancel', bitirDrag);
stage.addEventListener('wheel', e => { e.preventDefault(); D3.z = cl(D3.z - e.deltaY * .5, -520, 400); apply3D(); }, {passive: false});
// iki parmak yakınlaştırma
let pinch = 0;
stage.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) return;
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  if (pinch) { D3.z = cl(D3.z + (d - pinch) * 1.6, -520, 400); apply3D(); }
  pinch = d;
}, {passive: true});
stage.addEventListener('touchend', () => pinch = 0);
// seçim
globe.addEventListener('click', e => {
  if (D3.moved > 14) return;
  const t = e.target.closest('.t3');
  if (t) { gir3D(t.dataset.a); return; }
  const k = e.target.closest('.k3');
  if (k && D3.alan) { oyunKaynak = '3d'; startGame(D3.alan, +k.dataset.i); }
});
addEventListener('resize', () => { if (ekran === '3d') open3D(); });

/* ============ OYUN HOST ============ */
let oyunKaynak = 'alan';
const gc = $('#gcanvas'), gctx = gc.getContext('2d');
let GS = null, gRAF = null, gAlan = null, gIdx = 0;

function startGame(alanId, i) {
  gAlan = alanId; gIdx = i;
  const a = ALANOF[alanId], konu = KONU[alanId][i], G = GAMES[a.g];
  document.documentElement.style.setProperty('--a1', a.a);
  document.documentElement.style.setProperty('--a2', a.b);
  $('#gTitle').textContent = a.e + '  ' + konu[0];
  $('#ghint').textContent = G.ipucu;
  GS = {
    W: innerWidth, H: innerHeight, skin: a.skin, A: a, t: 0, done: null, score: 0, goal: 1,
    fx: [], p: {x: 0, y: 0, down: false, justDown: false}, keys: {}, sfx,
    words: konu[2] || null, langName: a.grp === 'Dil' ? a.n : null
  };
  G.start(GS);
  go('oyun');
  if (!gRAF) gameLoop();
}
function gameLoop() {
  gRAF = requestAnimationFrame(gameLoop);
  if (ekran !== 'oyun' || !GS) return;
  const G = GAMES[ALANOF[gAlan].g];
  GS.t++;
  if (!GS.done) G.update(GS);
  G.draw(GS, gctx);
  GS.p.justDown = false;
  if (GS.done) { const d = GS.done; GS = null; setTimeout(() => finish(d), 260); }
}
// girdi
function gpos(e) { const t = e.touches ? e.touches[0] : e; return {x: t.clientX, y: t.clientY}; }
gc.addEventListener('pointerdown', e => { if (!GS) return; gc.setPointerCapture(e.pointerId); const p = gpos(e); GS.p.x = p.x; GS.p.y = p.y; GS.p.down = true; GS.p.justDown = true; });
gc.addEventListener('pointermove', e => { if (!GS) return; const p = gpos(e); GS.p.x = p.x; GS.p.y = p.y; });
gc.addEventListener('pointerup', e => { if (!GS) return; GS.p.down = false; });
gc.addEventListener('pointercancel', e => { if (GS) GS.p.down = false; });
addEventListener('keydown', e => { if (!GS) return; if (e.key === 'ArrowUp') GS.keys.up = 1; if (e.key === 'ArrowDown') GS.keys.down = 1; });
addEventListener('keyup', e => { if (!GS) return; if (e.key === 'ArrowUp') GS.keys.up = 0; if (e.key === 'ArrowDown') GS.keys.down = 0; });

function oyundanCik() {
  GS = null;
  if (oyunKaynak === '3d') { D3.alan = gAlan; D3.mode = 'halka'; go('3d'); gir3D(gAlan); }
  else if (oyunKaynak === 'dunya') go('dunya');
  else openAlan(gAlan);
}
$('#gBack').onclick = oyundanCik;
$('#gRetry').onclick = () => startGame(gAlan, gIdx);

/* ============ SONUÇ ============ */
function finish(res) {
  const a = ALANOF[gAlan], konu = KONU[gAlan][gIdx];
  const yeni = !isDone(gAlan, gIdx);
  let odul = null;
  if (res === 'win') {
    S.wins++;
    if (yeni) {
      doneSet.add(key(gAlan, gIdx)); S.done.push(key(gAlan, gIdx)); S.xp += 10;
      const bid = ODUL_BLOK[a.grp] || 9, adet = 16;
      S.env[bid] = (S.env[bid] || 0) + adet;
      odul = {id: bid, adet};
      if (typeof envanterCiz === 'function') envanterCiz();
    }
    const t = bugun();
    if (S.last !== t) {
      const d = S.last ? (new Date(t) - new Date(S.last)) / 86400000 : 99;
      S.streak = d === 1 ? S.streak + 1 : 1; S.last = t;
    }
    save(); fanfare();
  }
  const sheet = $('#sheet');
  const sonraki = gIdx + 1 < KONU[gAlan].length ? gIdx + 1 : -1;
  if (res === 'win') {
    const kelimeler = konu[2];
    sheet.innerHTML = `
      <div class="mark">✓</div>
      <h3>${konu[0]}</h3>
      <div class="sub">${a.e} ${a.n}${yeni ? ' · +10 XP' : ''}</div>
      ${odul ? `<div style="display:flex;align-items:center;justify-content:center;gap:9px;margin-top:12px;
        background:rgba(255,255,255,.06);border-radius:14px;padding:10px 14px;font-weight:800;font-size:.92rem">
        <i style="width:22px;height:22px;border-radius:5px;display:block;background:${BLOK_RENK[odul.id]};
        box-shadow:inset 0 -6px 0 rgba(0,0,0,.22)"></i> +${odul.adet} ${W.BDEF[odul.id].ad} bloğu</div>` : ''}
      ${kelimeler
        ? `<div class="fact" style="padding:8px 14px">${kelimeler.map(w => `<div class="kelime"><span>${w[0]}</span><b>${w[1]}</b></div>`).join('')}</div>`
        : `<div class="fact">${konu[1]}</div>`}
      ${sonraki >= 0 ? '<button class="btn" id="nx">Sıradaki konu →</button>' : ''}
      <button class="btn soft" id="bk">${oyunKaynak === '3d' ? '3B moda dön' : oyunKaynak === 'dunya' ? '🌍 Dünyaya dön' : 'Alana dön'}</button>`;
  } else {
    sheet.innerHTML = `
      <div class="mark" style="background:rgba(255,255,255,.1);color:#fff">↻</div>
      <h3>Bu sefer olmadı</h3>
      <div class="sub">${GAMES[a.g].ipucu}</div>
      <button class="btn" id="rt">Tekrar dene</button>
      <button class="btn soft" id="bk">${oyunKaynak === '3d' ? '3B moda dön' : oyunKaynak === 'dunya' ? '🌍 Dünyaya dön' : 'Alana dön'}</button>`;
  }
  $('#sonuc').classList.add('on');
  const close = () => $('#sonuc').classList.remove('on');
  if ($('#nx')) $('#nx').onclick = () => { close(); startGame(gAlan, sonraki); };
  if ($('#rt')) $('#rt').onclick = () => { close(); startGame(gAlan, gIdx); };
  $('#bk').onclick = () => { close(); oyundanCik(); };
}

/* ============ BAŞLAT ============ */
buildListe(); buildBen(); dunyaAc();
setTimeout(() => wmsg(matchMedia('(pointer:coarse)').matches
  ? 'Sol yarı: yürü · Sağ yarı: bak · ⛏ kır · 🧱 koy · 🧭 kule bul'
  : 'Ekrana tıkla → fare kilidi · WASD yürü · Space zıpla · F uç · Sol tık kır · Sağ tık koy · E kuleye gir'), 900);
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
